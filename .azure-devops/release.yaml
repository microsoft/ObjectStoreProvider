pr: none
trigger:
  - master
variables:
  - group: InfoSec-SecurityResults
  - name: tags
    value: production,externalfacing
  - name: serviceTreeID
    value: 21f0b890-e3a8-4c0b-b9e7-2f764f8b799c
  - name: adoMirrorNpmFeedBaseUrl
    value: https://pkgs.dev.azure.com/DomoreexpGithub/Github_Pipelines/_packaging/github-npm-mirror/npm/registry/
  - name: adoNpmFeedBaseUrl
    value: https://pkgs.dev.azure.com/DomoreexpGithub/_packaging/GraphQL/npm/registry/

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates

  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-2022
        os: windows
    stages:
      - stage: release
        variables:
          # OPTIONAL: Set this varibale to 'true' to enable signing in a target stage.
          # Remove if signing is not required.
          Build.ESRP.CodeSign.Enabled: false
          # OPTIONAL: To disable required tools not applicable in the pipeline set to false.
          # Supported values: BinSkim, Roslyn, ESLint, PREFast.
          Build.SDL.<Roslyn>.Enabled: false
          Build.SDL.<ESLint>.Enabled: true
        jobs:
          - job: Build
            displayName: Build ObjectStoreProvider Package
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(System.DefaultWorkingDirectory)/dist
                  artifactName: package-$(Build.BuildId)-$(Build.BuildNumber)
                - output: pipelineArtifact
                  targetPath: $(System.DefaultWorkingDirectory)/packages
                  artifactName: npm-package-$(Build.BuildId)-$(Build.BuildNumber)
            steps:
              - checkout: self
              - task: NodeTool@0
                displayName: "Installing node"
                inputs:
                  versionSpec: "18"
              - script: |
                  cat <<'EOF' > "$(Agent.TempDirectory)/npm-mirror.npmrc"
                  always-auth=true
                  registry=$(adoMirrorNpmFeedBaseUrl)
                  EOF
                displayName: Create temporary .npmrc for mirror feed
              - task: npmAuthenticate@0
                inputs:
                  workingFile: "$(Agent.TempDirectory)/npm-mirror.npmrc"
              - script: |
                  TOKEN=$(grep '_authToken' "$(Agent.TempDirectory)/npm-mirror.npmrc" | head -1 | cut -d'=' -f2)
                  echo "##vso[task.setvariable variable=NPM_TOKEN;issecret=true]$TOKEN"
                displayName: Extract token from .npmrc
              - script: |
                  yarn config set npmAlwaysAuth true
                  yarn config set npmRegistryServer $(adoMirrorNpmFeedBaseUrl)
                displayName: Configure yarn for ADO npm feed
              - script: yarn install --immutable
                displayName: yarn
                env:
                  YARN_NPM_AUTH_TOKEN: $(NPM_TOKEN)
                  NPM_CONFIG_USERCONFIG: $(Agent.TempDirectory)/npm-mirror.npmrc
              - script: yarn build && yarn test:ci
                displayName: build and test [test]
                env:
                  YARN_NPM_AUTH_TOKEN: $(NPM_TOKEN)
                  NPM_CONFIG_USERCONFIG: $(Agent.TempDirectory)/npm-mirror.npmrc

              - script: |
                  mkdir -p $(System.DefaultWorkingDirectory)/packages
                  npm pack --pack-destination $(System.DefaultWorkingDirectory)/packages
                displayName: "Generate npm package (.tgz)"

          - job: PrivateAdoRelease
            displayName: Release to ADO npm feed
            dependsOn: Build
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            steps:
              - download: current
                artifact: npm-package-$(Build.BuildId)-$(Build.BuildNumber)
                displayName: Download npm package

              - script: |
                  cat <<'EOF' > "$(Agent.TempDirectory)/npm-private-feed.npmrc"
                  always-auth=true
                  registry=$(adoNpmFeedBaseUrl)
                  EOF
                displayName: Create temporary .npmrc for private ADO feed

              - task: npmAuthenticate@0
                displayName: Authenticate to private ADO feed
                inputs:
                  workingFile: "$(Agent.TempDirectory)/npm-private-feed.npmrc"

              - script: |
                  npm publish "$(Pipeline.Workspace)/npm-package-$(Build.BuildId)-$(Build.BuildNumber)"/*.tgz --registry "$(adoNpmFeedBaseUrl)"
                displayName: Publish to private ADO feed
                env:
                  NPM_CONFIG_USERCONFIG: $(Agent.TempDirectory)/npm-private-feed.npmrc

          - job: Release
            displayName: ObjectStoreProvider Release
            dependsOn: PrivateAdoRelease
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              image: ubuntu-latest
              os: linux
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: npm-package-$(Build.BuildId)-$(Build.BuildNumber)
                  targetPath: $(Pipeline.Workspace)/packages
            steps:
              - task: EsrpRelease@9
                displayName: "ESRP Release to npm"
                inputs:
                  connectedservicename: $(Release.ConnectedServiceName)
                  usemanagedidentity: true
                  keyvaultname: $(Release.KeyVaultName)
                  signcertname: $(Release.SignCertName)
                  clientid: $(Release.ClientId)
                  contenttype: "npm"
                  folderlocation: $(Pipeline.Workspace)/packages
                  owners: $(Release.Owners)
                  approvers: $(Release.Approvers)
                  mainpublisher: ESRPRELPACMAN
                  domaintenantid: $(Release.DomainTenantId)
